<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Write a finding</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <style>
        :root {
            --ink: #242424;
            --muted: #616161;
            --line: #d1d1d1;
            --accent: #0f6cbd;
            --surface: #faf9f8;
            --warn: #8a5300;
            --error: #b10e1c;
            --code-bg: #EDEAE7;
            --block-bg: #D7D2CB;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            font-family: "Segoe UI", -apple-system, system-ui, sans-serif;
            font-size: 13px;
            color: var(--ink);
        }

        .app { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }

        .tabs { display: flex; gap: 4px; align-items: center; border-bottom: 1px solid var(--line); }
        .spacer { flex: 1; }

        .tab {
            padding: 8px 14px;
            border: 0;
            border-bottom: 2px solid transparent;
            background: none;
            font: inherit;
            color: var(--muted);
            cursor: pointer;
        }

        .tab[aria-selected="true"] {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        .single, .split { flex: 1; min-height: 0; display: grid; gap: 12px; }
        .split { grid-template-columns: 1fr 1fr; }

        .editor { border: 1px solid var(--line); border-radius: 4px; overflow: auto; min-height: 0; }
        .cm-editor { height: 100%; }
        .cm-scroller { font-family: Consolas, "Courier New", monospace; font-size: 13px; }

        .preview { overflow: auto; padding: 4px 12px; border: 1px solid var(--line); border-radius: 4px; }
        .preview h1 { font-size: 20px; }
        .preview h2 { font-size: 17px; }
        .preview h3 { font-size: 15px; }
        .preview h4, .preview h5, .preview h6 { font-size: 13px; }
        .preview pre {
            background: var(--block-bg);
            padding: 8px;
            border-radius: 2px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .preview code.inline {
            background: var(--code-bg);
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            padding: 0 2px;
        }
        .preview li.ordered { list-style: decimal; }
        .preview li { margin-left: 20px; }

        /* Scoring sits above the editor, compact enough not to crowd it. */
        .cvss-bar {
            display: flex; flex-direction: column; gap: 6px;
            padding: 8px; background: var(--surface); border-radius: 4px;
        }
        .metrics { display: flex; flex-wrap: wrap; gap: 10px; }
        .metric { display: flex; align-items: center; gap: 2px; }
        .metric-id { font-size: 11px; color: var(--muted); margin-right: 2px; min-width: 18px; }
        .label { font-size: 12px; color: var(--muted); }

        .score-row { display: flex; align-items: baseline; gap: 8px; }
        .score-number { font-size: 20px; font-weight: 600; line-height: 1; }
        .score-severity { font-weight: 600; font-size: 12px; }
        .score-row .vector { flex: 1; }
        .score-row button { align-self: center; }

        .vector {
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px; word-break: break-all; color: var(--muted);
        }

        button {
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #fff;
            font: inherit;
            color: var(--ink);
            cursor: pointer;
        }

        button:hover:not(:disabled) { background: var(--surface); }
        button:disabled { opacity: .5; cursor: default; }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .choice { padding: 3px 7px; font-size: 12px; min-width: 24px; }
        .choice[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

        .written { display: flex; flex-direction: column; gap: 4px; max-height: 20vh; overflow: auto; }
        .entry { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .muted { color: var(--muted); }

        /* Loud on purpose: writing into a dialog that cannot insert loses work. */
        .disconnected {
            display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
            padding: 10px 12px; border-radius: 4px;
            background: #fdeaea; border: 1px solid var(--error); color: #6b1016;
            font-size: 12px;
        }

        .status { color: var(--muted); font-size: 12px; margin: 0; }
        .error { color: var(--error); font-size: 12px; margin: 0; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>

<body>
    <div id="app"></div>
</body>

</html>
